blueprint:
  name: Switch Button
  description: >-
    Sync Switch button relay state and light state (both directions). The relay is
    the source of truth: when either side comes back from unavailable, at startup
    and on automation reload, the light is set to the relay's state.
  domain: automation
  input:
    switch:
      name: switch
      description: The switch which controls the light
      selector:
        entity:
          domain: switch
    light:
      name: light
      description: The light to be controlled.
      selector:
        entity:
          domain: light
alias: switch_button
description: ""
trigger:
  - platform: state
    entity_id:
      - !input switch
      - !input light
    from: "off"
    to: "on"
    id: to_on
  - platform: state
    entity_id:
      - !input switch
      - !input light
    from: "on"
    to: "off"
    id: to_off
  - platform: state
    entity_id:
      - !input switch
      - !input light
    from: "unavailable"
    to: ["on", "off"]
    id: resync
  - platform: homeassistant
    event: start
    id: resync
  - platform: event
    event_type: automation_reloaded
    id: resync
variables:
  switch: !input switch
  light: !input light
  entities:
    - !input switch
    - !input light
condition: []
action:
  - choose:
      # The relay wins: set the light to the relay's state. Nothing is sent while
      # either side is unavailable/unknown; its return triggers this again.
      - conditions:
          - condition: trigger
            id: resync
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ states(switch) in ['on', 'off']
                     and states(light) in ['on', 'off']
                     and states(switch) != states(light) }}
            then:
              - action: "homeassistant.turn_{{ states(switch) }}"
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ light }}"
      - conditions:
          - condition: trigger
            id: to_on
        sequence:
          - action: homeassistant.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: "{{ entities | reject('eq', trigger.entity_id) | list }}"
      - conditions:
          - condition: trigger
            id: to_off
        sequence:
          - action: homeassistant.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: "{{ entities | reject('eq', trigger.entity_id) | list }}"
mode: single
