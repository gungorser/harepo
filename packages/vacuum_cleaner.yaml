# Vacuum cleaners: live maps from the Xiaomi cloud (Xiaomi Cloud Map Extractor, HACS v2.x).
# The vacuums themselves stay in the Xiaomi Miot UI integration: v1.1.x builds entities only
# from config entries (a `vacuum: - platform: xiaomi_miot` entry loads no spec and adds nothing).
#   vacuum.roborock_s5_d456_robot_cleaner   Roborock S5 (roborock.vacuum.s5), Yatak
#   vacuum.xiaomi_c102gl_9267_robot_cleaner Xiaomi X20+ (xiaomi.vacuum.c102gl), Salon
# Tokens and the Xiaomi account live in secrets.yaml; hosts are the vacuums' LAN addresses.

camera:
  # Roborock S5: supported by the extractor's xiaomi (Roborock) API.
  - platform: xiaomi_cloud_map_extractor
    name: yatak_vacuum_map
    host: 192.168.0.175
    token: !secret yatak_vacuum_token
    username: !secret xiaomi_cloud_username
    password: !secret xiaomi_cloud_password
    draw: ["all"]
    attributes:
      - calibration_points
      - charger
      - rooms
      - vacuum_position
      - vacuum_room
      - vacuum_room_name
    scan_interval:
      seconds: 10

  # Xiaomi X20+: its model is not in the extractor's list, so the Dreame API is forced.
  - platform: xiaomi_cloud_map_extractor
    name: salon_vacuum_map
    host: 192.168.0.77
    token: !secret salon_vacuum_token
    username: !secret xiaomi_cloud_username
    password: !secret xiaomi_cloud_password
    force_api: dreame
    draw: ["all"]
    attributes:
      - calibration_points
      - charger
      - rooms
      - vacuum_position
      - vacuum_room
      - vacuum_room_name
    scan_interval:
      seconds: 10
