lovelace:
  mode: storage
  resources:
    - url: /local/community/scheduler-card/scheduler-card.js
      type: module
    - url: /local/community/ha-floorplan/floorplan.js
      type: module
  dashboards:
    roomstate-dashboard:
      mode: yaml
      title: Gereksiz
      icon: mdi:power
      show_in_sidebar: true
      filename: gungors/dashboards/unnecessary.yaml
    floorplan-dashboard:
      mode: yaml
      title: Floorplan
      icon: mdi:floor-plan
      show_in_sidebar: true
      filename: gungors/dashboards/floorplan.yaml
    program-dashboard:
      mode: yaml
      title: Program
      icon: mdi:calendar-clock
      show_in_sidebar: true
      filename: gungors/dashboards/program.yaml
