# schedules.yaml — calendar-driven climate & cover scheduling
#
# Event description JSON: {"room_name": "<area name>", "temp": 22, "sleep_temp": 21, "darkness": true}
#   temp        -> heating target while the event is active
#   sleep_temp  -> used instead of temp, except in the first and last 30 minutes
#   darkness    -> the room's covers stay closed while the event is active (closed when it starts, opened when it ends)
#
# Scope: calendar triggers sync only the event's room; everything else (HA start, sunrise/sunset,
# manual/automation.trigger) syncs every room that has matching entities, in parallel.
# At 12:00 climates are turned off in rooms that have no event at all that day (others are left alone).
# The Program card (gungors-schedule-card) also calls the *_sync_room scripts after saving/deleting an event.

script:
  # ---------- shared ----------
  schedule_get_events:
    alias: schedule_get_events
    description: Schedule events overlapping [time, time + duration), parsed and mapped to area ids
    mode: parallel
    max: 50
    fields:
      time:
        description: ISO datetime
      duration:
        description: Window length in seconds (default 1 = active at that moment)
    sequence:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.sercan
            - calendar.melike
            - calendar.misafir
        data:
          start_date_time: "{{ time }}"
          duration:
            seconds: "{{ duration | default(1) | int }}"
        response_variable: raw
      - variables:
          result: >
            {% set ns = namespace(items=[]) %}
            {% for e in raw.values() | map(attribute='events') | sum(start=[]) %}
              {% set d = e.description | from_json %}
              {% set ns.items = ns.items + [dict(d, area_id=(d.room_name | area_id), start=e.start, end=e.end)] %}
            {% endfor %}
            {{ {'events': ns.items} }}
      - stop: done
        response_variable: result

  # ---------- climate ----------
  climate_schedule_get_room_temperature:
    alias: climate_schedule_get_room_temperature
    description: Target temperature of an area at a moment (null = no active event)
    mode: parallel
    max: 50
    fields:
      area_id:
        description: Area id
      time:
        description: ISO datetime
    sequence:
      - action: script.schedule_get_events
        data:
          time: "{{ time }}"
        response_variable: ev
      - variables:
          result: >
            {% set t = as_timestamp(time) %}
            {% set ns = namespace(temps=[]) %}
            {% for e in ev.events if e.area_id == area_id %}
              {% if e.sleep_temp is defined
                    and as_timestamp(e.start) + 1800 <= t
                    and as_timestamp(e.end) - 1800 > t %}
                {% set ns.temps = ns.temps + [e.sleep_temp] %}
              {% elif e.temp is defined %}
                {% set ns.temps = ns.temps + [e.temp] %}
              {% endif %}
            {% endfor %}
            {{ {'result': (ns.temps | max) if ns.temps else none} }}
      - stop: done
        response_variable: result

  climate_schedule_set_room_temperature:
    alias: climate_schedule_set_room_temperature
    description: Heat an area to a temperature, or turn its climates off when temperature is null
    mode: parallel
    max: 20
    fields:
      area_id:
        description: Area id
      temperature:
        description: Target temperature, null to turn off
    sequence:
      - if: "{{ temperature | float(none) is not none }}"
        then:
          - action: climate.set_temperature
            target:
              area_id: "{{ area_id }}"
            data:
              hvac_mode: heat
              temperature: "{{ temperature | float }}"
        else:
          - action: climate.set_hvac_mode
            target:
              area_id: "{{ area_id }}"
            data:
              hvac_mode: "off"

  climate_schedule_sync_room:
    alias: climate_schedule_sync_room
    description: Apply the scheduled temperature of one area; with only_on_change, only if it changed at this moment
    mode: parallel
    max: 20
    fields:
      area_id:
        description: Area id
      time:
        description: ISO datetime to evaluate (defaults to now)
      only_on_change:
        description: Skip unless the target differs from one second earlier
    sequence:
      - variables:
          at: "{{ time | default(now().isoformat(), true) }}"
      - action: script.climate_schedule_get_room_temperature
        data:
          area_id: "{{ area_id }}"
          time: "{{ at }}"
        response_variable: after
      - action: script.climate_schedule_get_room_temperature
        data:
          area_id: "{{ area_id }}"
          time: "{{ (as_datetime(at) - timedelta(seconds=1)).isoformat() }}"
        response_variable: before
      - condition: template
        value_template: "{{ not (only_on_change | default(false)) or before.result != after.result }}"
      - action: script.climate_schedule_set_room_temperature
        data:
          area_id: "{{ area_id }}"
          temperature: "{{ after.result }}"

  climate_schedule_off_idle_rooms:
    alias: climate_schedule_off_idle_rooms
    description: Turn off climates in rooms that have no schedule event at all today
    mode: single
    sequence:
      - action: script.schedule_get_events
        data:
          time: "{{ today_at('00:00').isoformat() }}"
          duration: 86400
        response_variable: day
      - variables:
          busy: "{{ day.events | map(attribute='area_id') | unique | list }}"
          idle: >
            {{ states.climate | map(attribute='entity_id') | map('area_id') | reject('none') | unique
               | reject('in', busy) | list }}
      - repeat:
          for_each: "{{ idle }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.climate_schedule_set_room_temperature
              data:
                variables:
                  area_id: "{{ repeat.item }}"
                  temperature: null

  # ---------- covers ----------
  cover_schedule_get_room_position:
    alias: cover_schedule_get_room_position
    description: Whether an area's covers should be open now (closed at night, or while a darkness event is active in the area)
    mode: parallel
    max: 50
    fields:
      area_id:
        description: Area id
      time:
        description: ISO datetime
    sequence:
      - action: script.schedule_get_events
        data:
          time: "{{ time }}"
        response_variable: ev
      - variables:
          result: >
            {% if is_state('sun.sun', 'below_horizon') %}
              {{ {'open': false} }}
            {% else %}
              {% set dark = ev.events | selectattr('area_id', 'eq', area_id)
                            | selectattr('darkness', 'defined') | selectattr('darkness')
                            | list | count > 0 %}
              {{ {'open': not dark} }}
            {% endif %}
      - stop: done
        response_variable: result

  cover_schedule_sync_room:
    alias: cover_schedule_sync_room
    description: Open or close one area's covers according to the schedule
    mode: parallel
    max: 20
    fields:
      area_id:
        description: Area id
      time:
        description: ISO datetime to evaluate (defaults to now)
    sequence:
      - action: script.cover_schedule_get_room_position
        data:
          area_id: "{{ area_id }}"
          time: "{{ time | default(now().isoformat(), true) }}"
        response_variable: pos
      - action: "cover.{{ 'open_cover' if pos.open else 'close_cover' }}"
        target:
          area_id: "{{ area_id }}"

automation:
  - id: climate_schedule
    alias: climate_schedule
    description: >-
      Calendar-driven heating. Event boundaries sync the event's room; start/manual runs sync all rooms;
      at 12:00 rooms without any event today are turned off.
    mode: queued
    max: 50
    triggers:
      - trigger: homeassistant
        event: start
        id: resync
      - trigger: time
        at: "12:00:00"
        id: midday
      - {trigger: calendar, entity_id: calendar.sercan,  event: start, offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.sercan,  event: start, offset: "+0:30:0", id: event}
      - {trigger: calendar, entity_id: calendar.sercan,  event: end,   offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.sercan,  event: end,   offset: "-0:30:0", id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: start, offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: start, offset: "+0:30:0", id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: end,   offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: end,   offset: "-0:30:0", id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: start, offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: start, offset: "+0:30:0", id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: end,   offset: "0:0:0",   id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: end,   offset: "-0:30:0", id: event}
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: midday
            sequence:
              - action: script.climate_schedule_off_idle_rooms
        default:
          - variables:
              is_event: "{{ trigger.id | default('') == 'event' }}"
              rooms: >
                {% if is_event %}
                  {{ [(trigger.calendar_event.description | from_json).room_name | area_id] }}
                {% else %}
                  {{ states.climate | map(attribute='entity_id') | map('area_id') | reject('none') | unique | list }}
                {% endif %}
              time: >
                {% if is_event %}
                  {% set base = trigger.calendar_event.start if trigger.event == 'start' else trigger.calendar_event.end %}
                  {{ (as_datetime(base) | as_local + trigger.offset).isoformat() }}
                {% else %}
                  {{ now().isoformat() }}
                {% endif %}
          - repeat:
              for_each: "{{ rooms }}"
              sequence:
                - action: script.turn_on
                  target:
                    entity_id: script.climate_schedule_sync_room
                  data:
                    variables:
                      area_id: "{{ repeat.item }}"
                      time: "{{ time }}"
                      only_on_change: "{{ is_event }}"

  - id: cover_schedule
    alias: cover_schedule
    description: >-
      Covers close at sunset and open at sunrise, except rooms with an active darkness event:
      those close when the event starts and open when it ends (if the sun is up).
    mode: queued
    max: 50
    triggers:
      - trigger: homeassistant
        event: start
        id: resync
      # sun.sun state, not the sun event: cover_schedule_get_room_position decides from
      # sun.sun, whose state lags the astronomical event by up to a few minutes.
      - trigger: state
        entity_id: sun.sun
        from: "below_horizon"
        to: "above_horizon"
        id: sun
      - trigger: state
        entity_id: sun.sun
        from: "above_horizon"
        to: "below_horizon"
        id: sun
      # Start: only darkness events sync (so e.g. a heating-only event doesn't reopen manually closed covers)
      - {trigger: calendar, entity_id: calendar.sercan,  event: start, offset: "0:0:0", id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: start, offset: "0:0:0", id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: start, offset: "0:0:0", id: event}
      - {trigger: calendar, entity_id: calendar.sercan,  event: end,   offset: "0:0:0", id: event}
      - {trigger: calendar, entity_id: calendar.melike,  event: end,   offset: "0:0:0", id: event}
      - {trigger: calendar, entity_id: calendar.misafir, event: end,   offset: "0:0:0", id: event}
    actions:
      - variables:
          is_event: "{{ trigger.id | default('') == 'event' }}"
          rooms: >
            {% if is_event %}
              {% set d = trigger.calendar_event.description | from_json %}
              {% if trigger.event == 'start' and not (d.darkness | default(false)) %}
                {{ [] }}
              {% else %}
                {{ [d.room_name | area_id] }}
              {% endif %}
            {% else %}
              {{ states.cover | map(attribute='entity_id') | map('area_id') | reject('none') | unique | list }}
            {% endif %}
          time: >
            {% if is_event %}
              {{ trigger.calendar_event.start if trigger.event == 'start' else trigger.calendar_event.end }}
            {% else %}
              {{ now().isoformat() }}
            {% endif %}
      - repeat:
          for_each: "{{ rooms }}"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.cover_schedule_sync_room
              data:
                variables:
                  area_id: "{{ repeat.item }}"
                  time: "{{ time }}"
